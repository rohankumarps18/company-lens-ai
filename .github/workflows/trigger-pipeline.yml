name: Trigger Company Intelligence Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Render Pipeline Endpoint
        run: |
          curl -X POST "${{ secrets.RENDER_PIPELINE_URL }}" \
            -H "Content-Type: application/json" \
            -d '{}'
