name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    env:
      # In-memory SQLite is safe here: app/core/database.py only applies
      # pool_size/max_overflow when the URL isn't sqlite, so no real
      # Postgres instance is needed just to run the test suite.
      DATABASE_URL: "sqlite:///:memory:"
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      API_KEY: ci-test-key
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-3.6-flash
      GOOGLE_SHEET_ID: ""
      GOOGLE_SERVICE_ACCOUNT_JSON: ""
      POLL_INTERVAL_SECONDS: "300"

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Run test suite
        run: pytest tests/ -v
