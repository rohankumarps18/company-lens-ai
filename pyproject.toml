[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "company-lens-ai"
version = "1.0.0"
description = "CompanyLens AI - company signal collection and Gemini-based fit verdicts"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Correctness-focused subset (pyflakes + pycodestyle errors) rather than
# ruff's full modernization/style rule set, so CI catches real bugs
# without demanding a repo-wide style rewrite.
select = ["E", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python-interpreter-path = "../.venv/Scripts/python.exe"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::pytest.PytestConfigWarning",
]